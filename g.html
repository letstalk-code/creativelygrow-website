<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Films · Creatively Grow</title>
    <meta name="robots" content="noindex, nofollow">
    <script>
        // The share page moved to /s so it can be rendered server-side, which is
        // the only way a texted link gets a real preview card. /g is redirected
        // at the edge (see vercel.json); this is the safety net for anyone who
        // lands on the file directly, and it keeps the gallery code intact.
        location.replace('/s' + location.search + location.hash);
    </script>
</head>
<body>
    <p>Taking you to your files… <a id="go" href="/s">continue</a></p>
    <script>document.getElementById('go').href = '/s' + location.search;</script>
</body>
</html>
