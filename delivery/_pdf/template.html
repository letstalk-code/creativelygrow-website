<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{DOC_TITLE}} — Creatively Grow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Creatively Grow print system — same tokens as the live editorial site
     (DESIGN-REFERENCE.md): cream ground, ink type, orange the only accent,
     hard rules instead of cards, zero radius on structure. */
  :root{
    --cream:#f9f8eb; --ink:#14100c; --sage:#4e5a4e; --hair:rgba(20,16,12,.22);
    --hair-lt:rgba(20,16,12,.12); --orange:#ef7938;
  }
  @page{ size:Letter; margin:0; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--cream); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif; font-size:10.3pt; line-height:1.55;
    font-variant-numeric:tabular-nums;
  }
  h1,h2,h3,h4{
    font-family:'Oswald',sans-serif; font-weight:700; text-transform:uppercase;
    line-height:1.08; margin:0; text-wrap:balance;
  }

  /* ---- cover ---- */
  .cover{
    height:11in; padding:0.95in 0.85in; display:flex; flex-direction:column;
    justify-content:space-between; page-break-after:always;
  }
  .cover-top{display:flex; justify-content:space-between; align-items:flex-start}
  .brand{font-family:'Oswald',sans-serif; font-weight:700; text-transform:uppercase;
    letter-spacing:.16em; font-size:11pt}
  .brand .sub{display:block; font-family:'Inter',sans-serif; font-weight:400;
    text-transform:none; letter-spacing:0; font-size:8pt; color:var(--sage); margin-top:3px}
  .doc-num{font-family:'Oswald',sans-serif; font-weight:700; font-size:13pt; color:var(--orange)}

  .cover-mid{border-top:2px solid var(--ink); padding-top:.4in}
  .eyebrow{display:block; font-family:'Oswald',sans-serif; font-weight:700;
    text-transform:uppercase; letter-spacing:.24em; font-size:10pt; color:var(--orange);
    margin-bottom:.22in}
  .cover-title{font-size:44pt; max-width:9in}
  .cover-sub{color:var(--sage); font-size:12.5pt; margin-top:.22in; max-width:6.4in; font-family:'Inter',sans-serif; font-weight:400; text-transform:none; letter-spacing:0}

  .cover-bottom{border-top:1px solid var(--hair); padding-top:.22in;
    display:flex; justify-content:space-between; font-size:8.5pt; color:var(--sage)}

  /* ---- body pages ---- */
  .body{padding:.85in .85in 1in}
  .body h1{font-size:19pt; margin:.5in 0 .18in; padding-top:.24in; border-top:2px solid var(--ink)}
  .body h1:first-child{margin-top:0; padding-top:0; border-top:0}
  .body h2{font-size:14.5pt; margin:.32in 0 .13in}
  .body h3{font-size:11.5pt; text-transform:none; letter-spacing:.01em; margin:.24in 0 .08in}
  .body h4{font-size:10.3pt; text-transform:none; font-family:'Inter',sans-serif; font-weight:700; margin:.16in 0 .06in}
  p{margin:0 0 .13in; orphans:3; widows:3}
  strong{font-weight:700}
  em{font-style:italic; color:var(--sage)}
  code{font-family:'SF Mono','Menlo',monospace; font-size:9pt; background:rgba(20,16,12,.06); padding:1px 4px}
  pre{background:var(--ink); color:#e8e6d8; padding:.16in; font-size:8.5pt;
    overflow-x:auto; margin:0 0 .16in; page-break-inside:avoid}
  pre code{background:none; padding:0; color:inherit}
  a{color:var(--orange); text-decoration:none}
  hr{border:0; border-top:1px solid var(--hair); margin:.24in 0}
  blockquote{border-left:3px solid var(--orange); margin:.16in 0; padding:.02in 0 .02in .18in;
    color:var(--ink); font-style:italic}

  ul,ol{margin:0 0 .16in; padding-left:.28in}
  li{margin-bottom:.06in; page-break-inside:avoid}
  ul.check{list-style:none; padding-left:0}
  ul.check li{display:flex; align-items:flex-start; gap:.1in; padding-left:0}
  ul.check .box{
    flex:0 0 auto; width:9pt; height:9pt; border:1.4pt solid var(--ink);
    margin-top:2.5pt; display:inline-block;
  }
  ul.check li.done .box{background:var(--orange); border-color:var(--orange)}
  ul.check li.done{color:var(--sage); text-decoration:line-through}

  /* brand-styled substitutes for the ⭐📱✅⏳ emoji, kept in-palette rather
     than falling back to the system color-emoji font */
  .mk-star{color:var(--orange); font-weight:700; font-size:1.1em}
  .mk-vert{
    display:inline-block; font-family:'Oswald',sans-serif; font-weight:700;
    text-transform:uppercase; letter-spacing:.05em; font-size:7pt;
    border:1pt solid var(--orange); color:var(--orange); padding:0 3pt;
    vertical-align:.5pt;
  }
  .mk-done{color:var(--orange); font-weight:700}
  .mk-wip{color:var(--sage); font-style:italic}

  /* A blank line to write on — replaces the old broken empty-blockquote
     artifact for fields meant to be filled in by hand on a printed copy. */
  .fill-lines{margin:0 0 .16in}
  .fill-line{
    display:block; height:.26in; border-bottom:1px solid var(--hair);
  }
  .fill-line:last-child{margin-bottom:0}

  .tbl-wrap{margin:0 0 .18in}
  table{width:100%; border-collapse:collapse; font-size:9.3pt}
  th,td{border:1px solid var(--hair); padding:.06in .1in; text-align:left; vertical-align:top}
  th{font-family:'Oswald',sans-serif; font-weight:700; text-transform:uppercase;
    letter-spacing:.05em; font-size:8pt; background:rgba(20,16,12,.05)}
  tr{page-break-inside:avoid}

  /* running footer via printed page numbers is handled by Chrome's own
     print-to-pdf footer when enabled; we render our own instead for full
     brand control, repeated per section via CSS page context is not
     available in print-to-pdf, so footer is omitted from body pages by
     design — the cover carries the document identity. */
</style>
</head>
<body>

<section class="cover">
  <div class="cover-top">
    <div class="brand">Creatively Grow<span class="sub">Video Content + Growth Systems · Tampa Bay, FL</span></div>
    <div class="doc-num">{{DOC_NUM}}</div>
  </div>
  <div class="cover-mid">
    <span class="eyebrow">Client Delivery System</span>
    <h1 class="cover-title">{{DOC_TITLE}}</h1>
    <p class="cover-sub">{{DOC_SUB}}</p>
  </div>
  <div class="cover-bottom">
    <span>Internal — not for client distribution</span>
    <span>creativelygrow.com</span>
  </div>
</section>

<section class="body">
{{BODY}}
</section>

</body>
</html>
