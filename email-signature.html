<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Creatively Grow — Email Signature</title>
</head>
<body style="margin:0; padding:40px 24px; background:#ffffff;">

<!-- ============================================================
     SELECT EVERYTHING BETWEEN THE TWO MARKERS BELOW, COPY,
     AND PASTE INTO GMAIL SETTINGS > SIGNATURE.
     Easiest way: click just before the logo, then shift-click
     just after the tagline, Cmd+C.
     ============================================================ -->

<!-- ===== SIGNATURE START ===== -->
<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;">
  <tr>

    <!-- Logo -->
    <td valign="top" style="padding:0 20px 0 0;">
      <a href="https://creativelygrow.com" style="text-decoration:none;">
        <img src="https://creativelygrow.com/assets/logo.png"
             width="100" height="100" alt="Creatively Grow"
             style="display:block; width:100px; height:100px; border:0; border-radius:16px;">
      </a>
    </td>

    <!-- Divider -->
    <td valign="top" style="padding:0; width:1px; background-color:#dcdcd0; font-size:0; line-height:0;">&nbsp;</td>

    <!-- Text block -->
    <td valign="top" style="padding:2px 0 0 20px;">

      <!-- Name -->
      <div style="font-size:19px; line-height:24px; font-weight:700; color:#1a2a1a; letter-spacing:0.2px;">
        Devon Curry
      </div>

      <!-- Title -->
      <div style="font-size:13px; line-height:18px; color:#4e5a4e; padding-top:2px;">
        Founder &amp; Growth Systems Builder
      </div>

      <!-- What Devon sells. Each pill is its own <td> so the background and
           padding survive Outlook, which ignores padding on inline-block spans. -->
      <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate; border-spacing:0; margin-top:11px;">
        <tr>
          <td bgcolor="#f1f4f0" style="padding:5px 9px; background-color:#f1f4f0; border-radius:3px; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:11px; line-height:14px; font-weight:600; color:#1a2a1a; white-space:nowrap;">CRM Builder</td>
          <td style="width:6px; font-size:0; line-height:0;">&nbsp;</td>
          <td bgcolor="#fdefe6" style="padding:5px 9px; background-color:#fdefe6; border-radius:3px; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:11px; line-height:14px; font-weight:600; color:#c25a1e; white-space:nowrap;">Landing Pages That Sell</td>
        </tr>
      </table>

      <!-- Tools. "BUILDS WITH" is deliberate: it states what Devon works in,
           which is true and defensible. Bare logos would imply certification or
           partnership, which is what Meta's brand terms actually police.
           alt="" on the marks so a client that blocks images degrades to the
           wordmarks beside them rather than printing the name twice. -->
      <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse; margin-top:13px;">
        <tr>
          <td valign="middle" style="padding:0 9px 0 0; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:9px; line-height:12px; font-weight:700; color:#9a9a8c; letter-spacing:1.1px; white-space:nowrap;">EXPERT IN</td>

          <td valign="middle" style="padding:0 5px 0 0; font-size:0; line-height:0;">
            <img src="https://creativelygrow.com/assets/sig-claude-mark.png" width="17" height="17" alt="" style="display:block; width:17px; height:17px; border:0;">
          </td>
          <td valign="middle" style="padding:0 14px 0 0; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:12px; line-height:16px; font-weight:600; color:#4e5a4e; white-space:nowrap;">Claude</td>

          <td valign="middle" style="padding:0 5px 0 0; font-size:0; line-height:0;">
            <img src="https://creativelygrow.com/assets/sig-meta-mark.png" width="28" height="17" alt="" style="display:block; width:28px; height:17px; border:0;">
          </td>
          <td valign="middle" style="padding:0 14px 0 0; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:12px; line-height:16px; font-weight:600; color:#4e5a4e; white-space:nowrap;">Meta Ads</td>

          <td valign="middle" style="padding:0 5px 0 0; font-size:0; line-height:0;">
            <img src="https://creativelygrow.com/assets/sig-gads-mark.png" width="17" height="17" alt="" style="display:block; width:17px; height:17px; border:0;">
          </td>
          <td valign="middle" style="font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:12px; line-height:16px; font-weight:600; color:#4e5a4e; white-space:nowrap;">Google Ads</td>
        </tr>
      </table>

      <!-- Contact -->
      <div style="padding-top:12px; font-size:13px; line-height:20px;">
        <a href="https://creativelygrow.com" style="color:#ef7938; text-decoration:none; font-weight:600;">creativelygrow.com</a>
        <span style="color:#c9c9bd;">&nbsp;&nbsp;|&nbsp;&nbsp;</span>
        <a href="tel:+17272708422" style="color:#4e5a4e; text-decoration:none;">(727) 270-8422</a>
      </div>

      <!-- Tagline. Spans the full text block so it reads as a bar rather than a
           chip, and centred so it lands as a statement instead of a caption. -->
      <table cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:separate; border-spacing:0; margin-top:12px; width:100%;">
        <tr>
          <td bgcolor="#1a2a1a" align="center" style="padding:9px 14px; background-color:#1a2a1a; border-radius:4px; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:12px; line-height:16px; font-weight:700; color:#f9f8eb; letter-spacing:1.2px; text-align:center; white-space:nowrap;">WE MAKE THE PHONE RING</td>
        </tr>
      </table>

    </td>
  </tr>
</table>
<!-- ===== SIGNATURE END ===== -->

</body>
</html>
